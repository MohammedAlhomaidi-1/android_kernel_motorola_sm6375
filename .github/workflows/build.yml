name: Build Motorola Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential zip gcc-aarch64-linux-gnu clang lld libssl-dev flex bison git

      - name: Enable BBR and FQ
        run: |
          # تفعيل BBR و FQ بشكل عدواني في جميع ملفات الإعدادات المحتملة
          find arch/arm64/configs/ -name "*defconfig" -exec sh -c 'echo "CONFIG_TCP_CONG_BBR=y" >> {}' \;
          find arch/arm64/configs/ -name "*defconfig" -exec sh -c 'echo "CONFIG_NET_SCH_FQ=y" >> {}' \;
          find arch/arm64/configs/ -name "*defconfig" -exec sh -c 'echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> {}' \;

      - name: Run Kernel Build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          # محاولة البناء بدون IAS (المجمع المدمج) لتفليل الأخطاء التقنية
          make O=out vendor/sm6375-gki_defconfig
          make O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc -j$(nproc)

      - name: Upload Result
        if: always() # سيحاول الرفع حتى لو فشل البناء لنرى الملفات الناتجة
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Result
          path: out/arch/arm64/boot/
