name: Build Motorola Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc build-essential zip gcc-aarch64-linux-gnu clang lld libssl-dev flex bison git

      - name: Configure BBR and FQ
        run: |
          # إضافة الإعدادات مباشرة لملف الإعدادات الذي وجدته
          TARGET_CONFIG="arch/arm64/configs/vendor/holi-qgki_defconfig"
          echo "CONFIG_TCP_CONG_BBR=y" >> $TARGET_CONFIG
          echo "CONFIG_NET_SCH_FQ=y" >> $TARGET_CONFIG
          echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> $TARGET_CONFIG
          
          # تحسينات إضافية للألعاب (اختياري)
          echo "CONFIG_HZ_1000=y" >> $TARGET_CONFIG
          echo "CONFIG_HZ=1000" >> $TARGET_CONFIG

      - name: Run Kernel Build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # استخدام ملف holi-qgki_defconfig المكتشف
          make O=out vendor/holi-qgki_defconfig
          
          # البدء بالبناء باستخدام مترجم Clang
          make O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc -j$(nproc)

      - name: Upload Kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Motorola-BBR
          path: out/arch/arm64/boot/Image.gz
